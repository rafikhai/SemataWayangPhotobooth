<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Semata Wayang - Your Moment</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;

            color: #111;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }


        .container {

            width: 100%;

            max-width: 480px;

            background: #fff;

            padding: 32px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.08);
        }


        .brand {

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }


        .eyebrow {

            font-size: 11px;

            letter-spacing: 2px;

            color: #777;

            margin-bottom: 10px;
        }


        h1 {

            margin: 0 0 10px;

            font-size: 30px;
        }


        .description {

            margin: 0 0 28px;

            color: #666;

            line-height: 1.6;
        }


        .photo-preview {

            width: 100%;

            margin-bottom: 24px;

            display: none;
        }


        .photo-preview img {

            width: 100%;

            display: block;

            border-radius: 12px;
        }


        .download-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .download-button {

            display: block;

            width: 100%;

            padding: 15px 18px;

            border-radius: 10px;

            background: #111;

            color: #fff;

            text-decoration: none;

            font-weight: 700;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .download-button:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }


        .download-button.secondary {

            background: #eee;

            color: #111;
        }


        .status {

            padding: 30px 0;

            color: #666;

            line-height: 1.6;
        }


        .footer {

            margin-top: 28px;

            font-size: 11px;

            color: #999;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="brand">
        SEMATA WAYANG
    </div>


    <div class="eyebrow">
        YOUR MOMENT
    </div>


    <h1>
        Hasil Foto Kamu
    </h1>


    <p class="description">
        Pilih file yang ingin kamu simpan.
    </p>


    <div
        id="photoPreview"
        class="photo-preview"
    >

        <img
            id="previewImage"
            alt="Hasil foto"
        >

    </div>


    <div
        id="downloadList"
        class="download-list"
    ></div>


    <div
        id="status"
        class="status"
    >
        Memuat file...
    </div>


    <div class="footer">
        SEMATA WAYANG PHOTOBOOTH
    </div>


</div>


<script>


async function getFiles() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const manifestUrl =
        params.get("manifest");

    if (!manifestUrl) {
        return null;
    }

    try {

        const response =
            await fetch(manifestUrl);

        if (!response.ok) {
            throw new Error(
                "Manifest tidak dapat dimuat."
            );
        }

        return await response.json();

    } catch (error) {

        console.error(
            "Gagal memuat manifest:",
            error
        );

        return null;
    }
}


function createDownloadButton(
    url,
    text,
    secondary = false
) {

    const link =
        document.createElement("a");


    link.href =
        url;


    link.target =
        "_blank";


    link.rel =
        "noopener";


    link.className =
        "download-button";


    if (secondary) {

        link.classList.add(
            "secondary"
        );
    }


    link.textContent =
        text;


    return link;
}


async function loadDownloadPage() {

    const files =
        await getFiles();


    const status =
        document.getElementById(
            "status"
        );


    const list =
        document.getElementById(
            "downloadList"
        );


    if (!files) {

        status.textContent =
            "Link hasil foto tidak valid.";

        return;
    }


    list.innerHTML = "";


    /*
     * JPG DENGAN FRAME
     */

    if (files.jpg) {

        list.appendChild(
            createDownloadButton(
                files.jpg,
                "DOWNLOAD JPG"
            )
        );


        const preview =
            document.getElementById(
                "photoPreview"
            );


        const image =
            document.getElementById(
                "previewImage"
            );


        image.src =
            files.jpg;


        preview.style.display =
            "block";
    }


    /*
     * FOTO ASLI
     */

    if (
        files.originals &&
        files.originals.length
    ) {

        files.originals.forEach(
            (url, index) => {

                list.appendChild(

                    createDownloadButton(
                        url,
                        `DOWNLOAD FOTO ${index + 1}`,
                        true
                    )

                );

            }
        );
    }


    /*
     * GIF
     */

    if (files.gif) {

        list.appendChild(

            createDownloadButton(
                files.gif,
                "DOWNLOAD GIF",
                true
            )

        );
    }


    /*
     * VIDEO
     */

    if (files.video) {

        list.appendChild(

            createDownloadButton(
                files.video,
                "DOWNLOAD VIDEO",
                true
            )

        );
    }


    status.style.display =
        "none";
}


loadDownloadPage();

</script>


</body>

</html>
